# ============================================================================
# xbuild (https://github.com/rust-mobile/xbuild) project manifest
# ----------------------------------------------------------------------------
# Build locally with:
#   x build --release --platform android --arch arm64 --format apk
#
# Pure NativeActivity app (eframe's `android-native-activity` backend), so no
# Gradle/Kotlin is needed: xbuild's built-in APK writer packages libtovek_gui.so
# directly. CI (.github/workflows/gui.yaml) symlinks a real NDK sysroot into
# ~/.cache/x/Android.ndk because xbuild's bundled 2022 sysroot has no API-34
# stubs, then zipaligns (16 KB pages) and signs the result.
# ============================================================================

android:
  manifest:
    package: "dev.tovek.gui"
    version_name: "2.7.0"
    version_code: 2700

    sdk:
      # 26+: modern storage semantics and a NativeActivity surface that eframe's
      # winit backend handles well. target 34 keeps Play-era devices happy; the
      # NDK sysroot wired up in CI provides the API-34 stubs xbuild compiles
      # against.
      min_sdk_version: 26
      target_sdk_version: 34

    uses_permission:
      # The embedded decompiler server (127.0.0.1:<port>) and the executor
      # client that posts bytecode to it.
      - name: "android.permission.INTERNET"
      - name: "android.permission.ACCESS_NETWORK_STATE"
      # Foreground/keep-alive support: TovekService (a real foreground service
      # in its own :tovek_server process — injected into the APK by CI, since
      # xbuild can't compile Java) runs the server, holds a partial wake lock +
      # WiFi lock and shows a persistent notification, so the server survives
      # the app being swiped away.
      - name: "android.permission.WAKE_LOCK"
      - name: "android.permission.FOREGROUND_SERVICE"
      - name: "android.permission.FOREGROUND_SERVICE_DATA_SYNC"
      # API 33+: makes the keep-alive notification (and its Stop action)
      # visible; the service runs either way.
      - name: "android.permission.POST_NOTIFICATIONS"
      # Lets the app show the system "ignore battery optimizations" dialog —
      # without the exemption most OEM ROMs kill even foreground services
      # when the task is swiped away (same requirement as Termux).
      - name: "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
      # Reading bytecode dumps from shared storage and writing decompiled
      # trees back. Legacy permissions for older devices, MANAGE_EXTERNAL_STORAGE
      # ("All files access", granted manually in system settings) for 30+.
      - name: "android.permission.READ_EXTERNAL_STORAGE"
        max_sdk_version: 32
      - name: "android.permission.WRITE_EXTERNAL_STORAGE"
        max_sdk_version: 29
      - name: "android.permission.MANAGE_EXTERNAL_STORAGE"

    application:
      label: "Tovek"
      # xbuild emits a NativeActivity-only manifest (it appends
      # android.app.lib_name + the MAIN/LAUNCHER intent filter to its default
      # activity automatically). The keep-alive <service> declaration, the
      # android:hasCode="true" flip and the classes.dex with TovekService are
      # injected afterwards by CI (scripts/patch_android_manifest.py +
      # javac/d8/apktool — see .github/workflows/gui.yaml).
